<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title">TCU 调用关系图</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px; color: #2C2C2A; background: #F7F6F2;
  }
  #app {
    display: grid; height: 100vh;
    grid-template-columns: 250px 1fr 310px;
    grid-template-rows: 48px 1fr;
    grid-template-areas: "top top top" "left main right";
  }
  header {
    grid-area: top; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; background: #fff; border-bottom: 1px solid rgba(0,0,0,.1);
  }
  .brand { font-weight: 500; font-size: 14px; margin-right: 4px; white-space: nowrap; }
  .brand small { color: #888780; font-weight: 400; margin-left: 6px; }
  input[type=search] {
    width: 220px; height: 30px; padding: 0 10px; font-size: 13px;
    border: 1px solid rgba(0,0,0,.16); border-radius: 8px; background: #fff; outline: none;
  }
  input[type=search]:focus { border-color: #185FA5; }
  select, button {
    height: 30px; padding: 0 9px; font-size: 12.5px; border-radius: 8px;
    border: 1px solid rgba(0,0,0,.16); background: #fff; color: #2C2C2A; cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #F1EFE8; }
  button.primary { background: #185FA5; color: #fff; border-color: #185FA5; }
  button.primary:hover { background: #0C447C; }
  .spacer { flex: 1; }
  .hint { color: #888780; font-size: 11.5px; white-space: nowrap; }
  .chk { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: #5F5E5A; cursor: pointer; user-select: none; white-space: nowrap; }
  .chk input { width: 14px; height: 14px; cursor: pointer; margin: 0; }

  aside { background: #fff; overflow: auto; }
  #left { grid-area: left; border-right: 1px solid rgba(0,0,0,.08); }
  #right { grid-area: right; border-left: 1px solid rgba(0,0,0,.08); }
  main { grid-area: main; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; }
  canvas.panning { cursor: grabbing; }
  canvas.over-node { cursor: move; }
  canvas.linking { cursor: crosshair; }

  .sec { padding: 12px 14px; border-bottom: 1px solid rgba(0,0,0,.07); }
  .sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 500; color: #5F5E5A; }
  .stat-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12.5px; }
  .stat-row span:last-child { color: #185FA5; font-variant-numeric: tabular-nums; }
  .chip {
    display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 11px;
    background: #E6F1FB; color: #0C447C; margin: 2px 3px 2px 0;
  }
  .chip.macro { background: #FAECE7; color: #993C1D; }
  .chip.fnptr { background: #EEEDFE; color: #534AB7; }
  .chip.manual { background: #EAF3DE; color: #3B6D11; }

  #results { list-style: none; margin: 0; padding: 0; }
  #results li { padding: 7px 8px; border-radius: 7px; cursor: pointer; margin-bottom: 2px; }
  #results li:hover { background: #F1EFE8; }
  #results li .fn { font-weight: 500; font-size: 12.5px; }
  #results li .meta { color: #888780; font-size: 11.5px; margin-top: 1px; }

  .detail-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; word-break: break-all; }
  .detail-meta { color: #888780; font-size: 12px; margin-bottom: 10px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11.5px; color: #5F5E5A; margin-bottom: 4px; }
  .field textarea, .field input[type=text] {
    width: 100%; padding: 6px 8px; font-size: 12.5px; font-family: inherit;
    border: 1px solid rgba(0,0,0,.16); border-radius: 7px; outline: none; resize: vertical;
  }
  .field textarea:focus, .field input:focus { border-color: #185FA5; }
  .swatches { display: flex; gap: 6px; }
  .sw { width: 22px; height: 22px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .sw.on { border-color: #2C2C2A; }
  .edge-item { font-size: 12px; padding: 5px 0; border-bottom: 1px dashed rgba(0,0,0,.08); }
  .edge-item:last-child { border: 0; }
  .edge-item b { font-weight: 500; }
  .empty { color: #B4B2A9; font-size: 12px; padding: 8px 0; }

  #tooltip {
    position: absolute; pointer-events: none; background: #2C2C2A; color: #fff;
    padding: 6px 9px; border-radius: 7px; font-size: 12px; opacity: 0;
    transition: opacity .12s; max-width: 320px; line-height: 1.5; z-index: 10;
  }
  #legend {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center;
    background: rgba(255, 255, 255, 0.94); padding: 6px 14px; border-radius: 20px;
    border: 1px solid rgba(0, 0, 0, 0.08); font-size: 11.5px; color: #5F5E5A;
    pointer-events: none; z-index: 5;
  }
  #legend span { display: inline-flex; align-items: center; white-space: nowrap; }
  #legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; margin-right: 5px; flex: 0 0 auto; }
  #legend em { font-style: normal; }

  .tree-sec { max-height: 58vh; overflow: auto; }
  #tree { font-size: 12.5px; user-select: none; }
  .tn {
    display: flex; align-items: center; gap: 3px; padding: 2px 4px;
    border-radius: 5px; cursor: pointer; white-space: nowrap;
  }
  .tn:hover { background: #F1EFE8; }
  .tn .tw { width: 12px; flex: 0 0 12px; color: #888780; font-size: 10px; text-align: center; }
  .tn .nm { overflow: hidden; text-overflow: ellipsis; }
  .tn.fn .nm { color: #5F5E5A; }
  .tn.fn input { margin: 0 1px 0 0; width: 13px; height: 13px; cursor: pointer; }
  .results-list { list-style: none; margin: 0 0 6px; padding: 0; }
  .results-list:empty { display: none; }
  .results-list li { padding: 5px 6px; border-radius: 6px; cursor: pointer; background: #F7F6F2; margin-bottom: 3px; }
  .results-list li:hover { background: #E6F1FB; }
  .results-list li .fn { font-weight: 500; }
  .results-list li .meta { color: #888780; font-size: 11px; }

  /* 右键菜单：标记函数变更分类 / 连线状态 */
  .ctx-menu {
    position: fixed;
    display: none;
    z-index: 1000;
    min-width: 150px;
    padding: 4px;
    background: #fff;
    border: 1px solid #D3D1C7;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
    font-size: 12.5px;
  }
  .ctx-menu.show { display: block; }
  .ctx-menu .title {
    padding: 5px 10px 6px;
    color: #888780;
    font-size: 11px;
    border-bottom: 1px solid #EFEDE7;
    margin-bottom: 3px;
  }
  .ctx-menu button {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    padding: 6px 10px;
    border: 0;
    background: transparent;
    border-radius: 5px;
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: #2C2C2A;
  }
  .ctx-menu button:hover { background: #F0F4F9; }
  .ctx-menu button.active { background: #E6F1FB; color: #0C447C; font-weight: 600; }
  .ctx-menu .sec-title {
    padding: 6px 10px 2px;
    color: #B4B2A9;
    font-size: 10.5px;
    letter-spacing: 0.02em;
  }
  .ctx-menu .swatch {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    border: 1px solid rgba(0, 0, 0, 0.16);
    flex: 0 0 auto;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span data-i18n="app.title">TCU 调用关系图</span><small id="rootName"></small></div>
    <input id="search" type="search" data-i18n-ph="search.placeholder" placeholder="搜索函数名，回车定位…" autocomplete="off">
    <select id="depth" data-i18n-title="depth.down1">
      <option value="1" data-i18n="depth.down1">向下 1 层</option>
      <option value="2" data-i18n="depth.down2">向下 2 层</option>
      <option value="3" selected data-i18n="depth.down3">向下 3 层</option>
      <option value="5" data-i18n="depth.down5">向下 5 层</option>
      <option value="9" data-i18n="depth.downAll">向下全部</option>
    </select>
    <select id="updepth">
      <option value="0" selected data-i18n="depth.up0">向上 0 层</option>
      <option value="1" data-i18n="depth.up1">向上 1 层</option>
      <option value="2" data-i18n="depth.up2">向上 2 层</option>
    </select>
    <label class="chk"><input type="checkbox" id="groupMode" checked><span data-i18n="btn.group">文件分组</span></label>
    <button id="optimalLayout" class="primary" aria-pressed="true" data-i18n="btn.optimal">最优布局</button>
    <button id="fit" data-i18n="btn.fit">适应</button>
    <button id="undoBtn" title="撤回 (Ctrl+Z)" disabled>&#8630;</button>
    <button id="redoBtn" title="重做 (Ctrl+Shift+Z)" disabled>&#8631;</button>
    <button id="resetLayout" data-i18n="btn.reset">重置布局</button>
    <button id="restoreDeleted" data-i18n="btn.restoreDeleted" disabled>恢复删除</button>
    <div class="spacer"></div>
    <span class="hint" data-i18n="hint.zoom">滚轮缩放 · 拖拽平移 · 双击下钻 · 拖节点自动重布线 · 选中连线拖线段调整走向 · 双击连线恢复自动</span>
    <button id="exportSvg" data-i18n="btn.svg">导出 SVG</button>
    <button id="exportPng" data-i18n="btn.png">PNG</button>
    <button id="exportHtml" data-i18n="btn.html">HTML</button>
    <button id="exportXlsx" data-i18n="btn.xlsx">Excel</button>
  </header>

  <aside id="left">
    <div class="sec tree-sec">
      <h3>文件</h3>
      <ul id="results" class="results-list"></ul>
      <div id="tree"><div class="empty">加载中…</div></div>
    </div>
    <div class="sec">
      <h3 data-i18n="panel.overview">工程概览</h3>
      <div id="stats"></div>
    </div>
  </aside>

  <main>
    <canvas id="cv"></canvas>
    <div id="legend">
      <span><i style="border-color:#2C2C2A"></i><em data-i18n="legend.call">函数调用</em></span>
      <span><i style="border-color:#2C2C2A;border-top-style:dashed"></i><em data-i18n="legend.var">变量访问</em></span>
      <span><i style="border-color:#D9303E"></i><em data-i18n="legend.added">新增</em></span>
      <span><i style="border-color:#2C2C2A"></i><em data-i18n="legend.deleted">删除</em></span>
      <span><i style="border-color:#C2410C;border-top-style:dotted"></i><em data-i18n="legend.dfWrite">写入共享变量</em></span>
      <span><i style="border-color:#0E7490;border-top-style:dotted"></i><em data-i18n="legend.dfRead">读取共享变量</em></span>
    </div>
    <div id="tooltip"></div>
    <div id="ctxMenu" class="ctx-menu"></div>
  </main>

  <aside id="right">
    <div class="sec">
      <h3 data-i18n="panel.detail">节点详情</h3>
      <div id="detail"><div class="empty" data-i18n="empty.detail">点击图中节点查看详情</div></div>
    </div>
    <div class="sec">
      <h3 data-i18n="panel.edges">调用关系</h3>
      <div id="edges"><div class="empty" data-i18n="empty.edges">—</div></div>
    </div>
  </aside>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>

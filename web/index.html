<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 内容安全策略：源码里的函数名/文件名会进 DOM，禁掉内联脚本与外链加载，
     避免被扫描的 C 工程内容成为注入入口 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<title data-i18n="app.title">TCU 调用关系图</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px; color: #2C2C2A; background: #F7F6F2;
  }
  #app {
    display: grid; height: 100vh;
    grid-template-columns: 250px 1fr 310px;
    grid-template-rows: 48px 1fr;
    grid-template-areas: "top top top" "left main right";
  }
  header {
    grid-area: top; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; background: #fff; border-bottom: 1px solid rgba(0,0,0,.1);
  }
  .brand { font-weight: 500; font-size: 14px; margin-right: 4px; white-space: nowrap; }
  .brand small { color: #888780; font-weight: 400; margin-left: 6px; }
  input[type=search] {
    width: 220px; height: 30px; padding: 0 10px; font-size: 13px;
    border: 1px solid rgba(0,0,0,.16); border-radius: 8px; background: #fff; outline: none;
  }
  input[type=search]:focus { border-color: #185FA5; }
  select, button {
    height: 30px; padding: 0 9px; font-size: 12.5px; border-radius: 8px;
    border: 1px solid rgba(0,0,0,.16); background: #fff; color: #2C2C2A; cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #F1EFE8; }
  button.primary { background: #185FA5; color: #fff; border-color: #185FA5; }
  button.primary:hover { background: #0C447C; }
  .spacer { flex: 1; }
  .hint { color: #888780; font-size: 11.5px; white-space: nowrap; }
  .chk { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: #5F5E5A; cursor: pointer; user-select: none; white-space: nowrap; }
  .chk input { width: 14px; height: 14px; cursor: pointer; margin: 0; }

  aside { background: #fff; overflow: auto; }
  #left { grid-area: left; border-right: 1px solid rgba(0,0,0,.08); }
  #right { grid-area: right; border-left: 1px solid rgba(0,0,0,.08); }
  main { grid-area: main; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; }
  canvas.panning { cursor: grabbing; }
  canvas.over-node { cursor: move; }
  canvas.linking { cursor: crosshair; }

  .sec { padding: 12px 14px; border-bottom: 1px solid rgba(0,0,0,.07); }
  .sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 500; color: #5F5E5A; }
  .stat-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12.5px; }
  .stat-row span:last-child { color: #185FA5; font-variant-numeric: tabular-nums; }
  .chip {
    display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 11px;
    background: #E6F1FB; color: #0C447C; margin: 2px 3px 2px 0;
  }
  .chip.macro { background: #FAECE7; color: #993C1D; }
  .chip.fnptr { background: #EEEDFE; color: #534AB7; }
  .chip.manual { background: #EAF3DE; color: #3B6D11; }

  #results { list-style: none; margin: 0; padding: 0; }
  #results li { padding: 7px 8px; border-radius: 7px; cursor: pointer; margin-bottom: 2px; }
  #results li:hover { background: #F1EFE8; }
  #results li .fn { font-weight: 500; font-size: 12.5px; }
  #results li .meta { color: #888780; font-size: 11.5px; margin-top: 1px; }

  .detail-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; word-break: break-all; }
  .detail-meta { color: #888780; font-size: 12px; margin-bottom: 10px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11.5px; color: #5F5E5A; margin-bottom: 4px; }
  .field textarea, .field input[type=text] {
    width: 100%; padding: 6px 8px; font-size: 12.5px; font-family: inherit;
    border: 1px solid rgba(0,0,0,.16); border-radius: 7px; outline: none; resize: vertical;
  }
  .field textarea:focus, .field input:focus { border-color: #185FA5; }
  .swatches { display: flex; gap: 6px; }
  .sw { width: 22px; height: 22px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .sw.on { border-color: #2C2C2A; }
  .edge-item { font-size: 12px; padding: 5px 0; border-bottom: 1px dashed rgba(0,0,0,.08); }
  .edge-item:last-child { border: 0; }
  .edge-item b { font-weight: 500; }
  .empty { color: #B4B2A9; font-size: 12px; padding: 8px 0; }

  /* ---- 连线标签面板 ---- */
  .detail-hint { color: #888780; font-size: 11.5px; line-height: 1.6; }
  .lbl-head {
    font-size: 12px; color: #5F5E5A; margin-bottom: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lbl-presets { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .lbl-preset {
    display: flex; align-items: center; gap: 8px; height: auto;
    padding: 6px 8px; text-align: left; border-radius: 8px;
    border: 1px solid rgba(0,0,0,.12); background: #fff;
  }
  .lbl-preset:hover { background: #F7F6F2; }
  .lbl-preset.on { border-color: #185FA5; background: #E6F1FB; }
  .lbl-preset em { font-style: normal; margin-left: auto; color: #888780; font-size: 11px; }
  .lbl-demo {
    font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.5;
    padding: 1px 7px; border-radius: 4px; white-space: nowrap;
  }
  .lbl-demo.task { color: #2C2C2A; background: #fff; border: 1.4px solid #2C2C2A; }
  .lbl-demo.conn { color: #C0392B; background: #fff; border: 1.4px solid #C0392B; }
  .lbl-demo.call { color: #2C2C2A; background: transparent; border: 0; padding-left: 0; }
  .lbl-colors { display: flex; align-items: center; gap: 8px; }
  .lbl-colors input[type=color] {
    width: 34px; height: 24px; padding: 0; border: 1px solid rgba(0,0,0,.16);
    border-radius: 5px; background: #fff; cursor: pointer;
  }
  .lbl-colors input[type=color]:disabled { opacity: .4; cursor: default; }
  .lbl-aa { font-weight: 600; font-size: 13px; }
  .lbl-actions { display: flex; gap: 6px; margin-top: 10px; }
  .lbl-actions button { flex: 1; }
  .lbl-note { color: #888780; font-size: 11px; line-height: 1.55; margin-top: 8px; }

  #tooltip {
    position: absolute; pointer-events: none; background: #2C2C2A; color: #fff;
    padding: 6px 9px; border-radius: 7px; font-size: 12px; opacity: 0;
    transition: opacity .12s; max-width: 320px; line-height: 1.5; z-index: 10;
  }
  #legend {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center;
    background: rgba(255, 255, 255, 0.94); padding: 6px 14px; border-radius: 20px;
    border: 1px solid rgba(0, 0, 0, 0.08); font-size: 11.5px; color: #5F5E5A;
    pointer-events: none; z-index: 5;
  }
  #legend span { display: inline-flex; align-items: center; white-space: nowrap; }
  #legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; margin-right: 5px; flex: 0 0 auto; }
  #legend em { font-style: normal; }

  .tree-sec { max-height: 58vh; overflow: auto; }
  #tree { font-size: 12.5px; user-select: none; }
  .tn {
    display: flex; align-items: center; gap: 3px; padding: 2px 4px;
    border-radius: 5px; cursor: pointer; white-space: nowrap;
  }
  .tn:hover { background: #F1EFE8; }
  .tn.hl { background: #FDF0C8; box-shadow: inset 0 0 0 1px #EFC35A; border-radius: 4px; }
  #vars { max-height: 260px; overflow-y: auto; overflow-x: hidden; margin: -2px -2px 0; padding: 0 2px; }
  .vars-bar { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; }
  .vars-bar input {
    flex: 1 1 auto; min-width: 0; height: 22px; padding: 0 6px;
    border: 1px solid #E4E1D8; border-radius: 5px; background: #FBFAF6;
    font: inherit; font-size: 11.5px; color: #2C2C2A;
  }
  .vars-bar input:focus { outline: none; border-color: #B5D4F4; background: #fff; }
  .vars-cnt { flex: 0 0 auto; color: #B4B2A9; font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .var-row {
    display: grid;
    grid-template-columns: 13px minmax(0, 1.15fr) auto minmax(0, 1fr) 32px;
    align-items: center;
    column-gap: 5px;
    padding: 1px 2px;
    font-size: 11.5px;
    border-radius: 4px;
    cursor: pointer;
    line-height: 17px;
  }
  .var-row:hover { background: #F5F3EC; }
  .var-row input { margin: 0; width: 12px; height: 12px; cursor: pointer; }
  .var-row .vn {
    color: #2C2C2A; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .var-row .vt { color: #B4B2A9; font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .var-row .vc { color: #888780; font-size: 10px; text-align: right; font-variant-numeric: tabular-nums; }
  .var-row .vg {
    padding: 0 3px; border-radius: 3px; background: #EFEDE7; color: #888780;
    font-size: 9px; line-height: 14px; letter-spacing: .02em;
  }
  .var-file {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: center; gap: 4px;
    overflow: hidden;
    margin: 3px 0 1px; padding: 2px 2px;
    background: #fff; color: #888780; font-size: 10.5px;
    cursor: pointer; user-select: none;
  }
  .var-file:hover { color: #2C2C2A; }
  .var-file .tw { width: 9px; font-size: 7px; color: #A8A69C; line-height: 1; }
  .var-file .cnt { margin-left: auto; color: #C9C6BC; font-size: 10px; flex: 0 0 auto; }
  .var-file .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tn .tw { width: 12px; flex: 0 0 12px; color: #888780; font-size: 10px; text-align: center; }
  .tn .nm { overflow: hidden; text-overflow: ellipsis; }
  .tn.fn .nm { color: #5F5E5A; }
  .tn.fn input { margin: 0 1px 0 0; width: 13px; height: 13px; cursor: pointer; }
  .results-list { list-style: none; margin: 0 0 6px; padding: 0; }
  .results-list:empty { display: none; }
  .results-list li { padding: 5px 6px; border-radius: 6px; cursor: pointer; background: #F7F6F2; margin-bottom: 3px; }
  .results-list li:hover { background: #E6F1FB; }
  .results-list li .fn { font-weight: 500; }
  .results-list li .meta { color: #888780; font-size: 11px; }

  /* 右键菜单：标记函数变更分类 / 连线状态 */
  .ctx-menu {
    position: fixed;
    display: none;
    z-index: 1000;
    min-width: 150px;
    padding: 4px;
    background: #fff;
    border: 1px solid #D3D1C7;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
    font-size: 12.5px;
  }
  .ctx-menu.show { display: block; }
  .ctx-menu .title {
    padding: 5px 10px 6px;
    color: #888780;
    font-size: 11px;
    border-bottom: 1px solid #EFEDE7;
    margin-bottom: 3px;
  }
  .ctx-menu button {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    padding: 6px 10px;
    border: 0;
    background: transparent;
    border-radius: 5px;
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: #2C2C2A;
  }
  .ctx-menu button:hover { background: #F0F4F9; }
  .ctx-menu button.active { background: #E6F1FB; color: #0C447C; font-weight: 600; }
  .ctx-menu .sec-title {
    padding: 6px 10px 2px;
    color: #B4B2A9;
    font-size: 10.5px;
    letter-spacing: 0.02em;
  }
  .ctx-menu .swatch {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    border: 1px solid rgba(0, 0, 0, 0.16);
    flex: 0 0 auto;
  }

  /* ---- 弹层（工程选择 / 时间轴） ---- */
  .mask {
    position: absolute; inset: 0; background: rgba(20, 20, 18, 0.28);
    display: none; z-index: 40;
  }
  .mask.show { display: block; }
  .modal {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 560px; max-height: 74vh; display: none; flex-direction: column;
    background: #fff; border-radius: 14px; z-index: 41;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2); overflow: hidden;
  }
  .modal.show { display: flex; }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }
  .modal-head h2 { margin: 0; font-size: 14px; font-weight: 500; }
  .modal-close {
    border: 0; background: transparent; font-size: 18px; line-height: 1;
    color: #888780; cursor: pointer; padding: 0 4px;
  }
  .modal-body { padding: 10px 12px; overflow: auto; flex: 1; }
  .modal-foot {
    display: flex; gap: 8px; padding: 10px 12px;
    border-top: 1px solid rgba(0, 0, 0, 0.08); background: #FBFAF7;
  }
  .modal-foot input {
    flex: 1; height: 30px; padding: 0 10px; font-size: 12.5px; font-family: inherit;
    border: 1px solid rgba(0, 0, 0, 0.16); border-radius: 8px; outline: none;
  }

  .session-foot { border-top: 0; padding-top: 0; background: #fff; }
  .session-foot .hint { font-size: 11.5px; color: #5F5E5A; }
  .ai-hint { margin: 2px 0 10px; color: #888780; font-size: 12px; }
  .ai-level {
    display: flex; align-items: flex-start; gap: 9px;
    padding: 9px 10px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent;
  }
  .ai-level:hover { background: #F5F4EF; }
  .ai-level input { margin-top: 3px; }
  .ai-level-text strong { display: block; font-size: 13px; font-weight: 500; }
  .ai-level-text small { display: block; color: #888780; font-size: 11.5px; margin-top: 2px; }
  .ai-locked { margin: 10px 0 0; color: #B3541E; font-size: 12px; }

  .proj {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent;
  }
  .proj:hover { background: #F5F4EF; }
  .proj.current { background: #E6F1FB; border-color: #B5D4F4; }
  .proj .nm { font-weight: 500; font-size: 13px; }
  .proj .pt { color: #888780; font-size: 11.5px; word-break: break-all; margin-top: 1px; }
  .proj .tm { color: #B4B2A9; font-size: 11px; white-space: nowrap; }
  .proj .badge {
    font-size: 10.5px; padding: 1px 6px; border-radius: 20px;
    background: #EAF3DE; color: #3B6D11; white-space: nowrap;
  }

  .ev {
    display: flex; gap: 9px; padding: 7px 9px; border-radius: 8px; cursor: pointer;
  }
  .ev:hover { background: #F5F4EF; }
  .ev.on { background: #E6F1FB; }
  .ev .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex: 0 0 auto; background: #B4B2A9; }
  .ev.k-annotate .dot { background: #378ADD; }
  .ev.k-layout .dot { background: #97C459; }
  .ev.k-delete .dot { background: #E24B4A; }
  .ev.k-anchor .dot { background: #888780; }
  .ev .txt { font-size: 12.5px; line-height: 1.5; }
  .ev .sub { color: #888780; font-size: 11px; margin-top: 1px; }
  /* AI 徽标：actor=ai 的事件（MCP 写入）与人工改动区分 */
  .ev .ai-badge {
    display: inline-block; font-size: 10px; line-height: 1; padding: 2px 5px;
    border-radius: 4px; background: #F0E9FB; color: #7B5CD6; font-weight: 600;
    vertical-align: 1px; margin-left: 4px;
  }
  .ev-day {
    font-size: 11px; color: #888780; padding: 10px 9px 4px; font-weight: 500;
  }

  /* 时间轴工具条：搜索 + 类型筛选 */
  .tl-tools {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; border-bottom: 1px solid rgba(0, 0, 0, 0.07); background: #FBFAF7;
  }
  .tl-tools input {
    flex: 1; min-width: 140px; height: 28px; padding: 0 9px; font-size: 12.5px; font-family: inherit;
    border: 1px solid rgba(0, 0, 0, 0.16); border-radius: 8px; outline: none;
  }
  .tl-tools input:focus { border-color: #185FA5; }
  .tl-chips { display: flex; gap: 4px; }
  .tl-chips button {
    height: 26px; padding: 0 9px; font-size: 11.5px; border-radius: 13px;
    border: 1px solid rgba(0, 0, 0, 0.14); background: #fff; color: #5F5E5A;
  }
  .tl-chips button.on { background: #185FA5; border-color: #185FA5; color: #fff; }
  .tl-count { font-size: 11.5px; color: #888780; white-space: nowrap; }
  .tl-more {
    display: block; width: 100%; margin: 8px 0 4px; height: 30px; font-size: 12px;
    border-radius: 8px; border: 1px dashed rgba(0, 0, 0, 0.2); background: #fff; color: #5F5E5A;
  }
  .tl-more:hover { background: #F5F4EF; }

  /* 书签行 */
  .bm { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
  .bm:hover { background: #F5F4EF; }
  .bm .nm { font-size: 13px; font-weight: 500; word-break: break-all; }
  .bm .meta { color: #888780; font-size: 11.5px; margin-top: 1px; }
  .bm .del {
    opacity: 0; border: 0; background: transparent; color: #A32D2D;
    cursor: pointer; font-size: 15px; line-height: 1; padding: 3px 7px; border-radius: 6px;
  }
  .bm:hover .del { opacity: 1; }
  .bm .del:hover { background: #FCEBEB; }

  /* 失效标注提示：贴在工程面板底部，有内容才出现 */
  .orphan-box { display: none; }
  .orphan-box.show {
    display: block; padding: 9px 12px; background: #FAEEDA;
    border-top: 1px solid #FAC775;
  }
  .orphan-head { display: flex; align-items: flex-start; gap: 10px; }
  .orphan-head .nm { font-size: 12.5px; font-weight: 500; color: #633806; }
  .orphan-head .pt { font-size: 11.5px; color: #854F0B; margin-top: 2px; }
  .orphan-head .ids {
    font-family: ui-monospace, "Cascadia Mono", monospace;
    font-size: 11px; color: #854F0B; margin-top: 5px; word-break: break-all; opacity: 0.85;
  }
  .orphan-head button { flex: 0 0 auto; }

  /* 回看横幅：贴在画布顶部（图例下方），提示当前不是最新状态 */
  .review-bar {
    position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 8px; z-index: 20;
    background: #FAEEDA; border: 1px solid #EF9F27; color: #633806;
    padding: 5px 8px 5px 12px; border-radius: 20px; font-size: 12px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08); white-space: nowrap;
  }
  .review-bar.show { display: flex; }
  .review-bar button { height: 24px; font-size: 11.5px; border-radius: 12px; }
  .review-bar.blocked { animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(-50%); }
    25% { transform: translateX(calc(-50% - 4px)); }
    75% { transform: translateX(calc(-50% + 4px)); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span data-i18n="app.title">TCU 调用关系图</span><small id="rootName"></small></div>
    <button id="projectBtn" title="切换工程" data-i18n-title="btn.project">工程</button>
    <input id="search" type="search" data-i18n-ph="search.placeholder" placeholder="搜索函数名，回车定位…" autocomplete="off">
    <select id="depth" data-i18n-title="depth.down1">
      <option value="1" data-i18n="depth.down1">向下 1 层</option>
      <option value="2" data-i18n="depth.down2">向下 2 层</option>
      <option value="3" selected data-i18n="depth.down3">向下 3 层</option>
      <option value="5" data-i18n="depth.down5">向下 5 层</option>
      <option value="9" data-i18n="depth.downAll">向下全部</option>
    </select>
    <select id="updepth">
      <option value="0" selected data-i18n="depth.up0">向上 0 层</option>
      <option value="1" data-i18n="depth.up1">向上 1 层</option>
      <option value="2" data-i18n="depth.up2">向上 2 层</option>
    </select>
    <label class="chk"><input type="checkbox" id="groupMode" checked><span data-i18n="btn.group">文件分组</span></label>
    <button id="optimalLayout" class="primary" aria-pressed="true" title="固定布局：增删函数/变量时保持现有位置，只有放不下才调整" data-i18n="btn.fixed" data-i18n-title="btn.fixedTitle">固定布局</button>
    <button id="fit" data-i18n="btn.fit">适应</button>
    <button id="undoBtn" title="撤回 (Ctrl+Z)" data-i18n-title="btn.undo" disabled>&#8630;</button>
    <button id="redoBtn" title="重做 (Ctrl+Shift+Z)" data-i18n-title="btn.redo" disabled>&#8631;</button>
    <button id="resetLayout" data-i18n="btn.reset">重置布局</button>
    <button id="restoreDeleted" data-i18n="btn.restoreDeleted" disabled>恢复删除</button>
    <button id="bookmarkBtn" data-i18n="btn.bookmark">书签</button>
    <button id="timelineBtn" data-i18n="btn.timeline">时间轴</button>
    <div class="spacer"></div>
    <span class="hint" data-i18n="hint.zoom">滚轮缩放 · 拖拽平移 · 双击函数下钻 · Ctrl+Z 回退视图 · 拖节点自动重布线 · 双击连线恢复自动</span>
    <button id="exportSvg" data-i18n="btn.svg">导出 SVG</button>
    <button id="exportPng" data-i18n="btn.png">PNG</button>
    <button id="exportHtml" data-i18n="btn.html">HTML</button>
    <button id="exportXlsx" data-i18n="btn.xlsx">Excel</button>
    <button id="aiBtn" title="AI 客户端（MCP）访问权限" data-i18n-title="btn.ai">AI 访问</button>
  </header>

  <aside id="left">
    <div class="sec tree-sec">
      <h3 data-i18n="panel.files">文件</h3>
      <ul id="results" class="results-list"></ul>
      <div id="tree"><div class="empty" data-i18n="tree.loading">加载中…</div></div>
    </div>
    <div class="sec">
      <h3 data-i18n="panel.overview">工程概览</h3>
      <div id="stats"></div>
    </div>
  </aside>

  <main>
    <canvas id="cv"></canvas>
    <div id="legend">
      <span><i style="border-color:#2C2C2A"></i><em data-i18n="legend.call">函数调用</em></span>
      <span><i style="border-color:#2C2C2A;border-top-style:dashed"></i><em data-i18n="legend.var">变量访问</em></span>
      <span><i style="border-color:#D9303E"></i><em data-i18n="legend.added">新增</em></span>
      <span><i style="border-color:#2C2C2A"></i><em data-i18n="legend.deleted">删除</em></span>
      <span><i style="border-color:#C2410C;border-top-style:dotted"></i><em data-i18n="legend.dfWrite">写入共享变量</em></span>
      <span><i style="border-color:#0E7490;border-top-style:dotted"></i><em data-i18n="legend.dfRead">读取共享变量</em></span>
    </div>
    <div id="tooltip"></div>
    <div id="ctxMenu" class="ctx-menu"></div>

    <div id="reviewBar" class="review-bar">
      <span id="reviewText"></span>
      <button id="reviewRestore" class="primary">恢复到此</button>
      <button id="reviewExit">回到最新</button>
    </div>
  </main>

  <div id="overlayMask" class="mask"></div>

  <div id="projectModal" class="modal">
    <div class="modal-head">
      <h2 data-i18n="project.title">选择工程</h2>
      <button class="modal-close" data-close="projectModal">&times;</button>
    </div>
    <div class="modal-body" id="projectList"></div>
    <div id="orphanBox" class="orphan-box"></div>
    <div class="modal-foot">
      <input id="projectPath" type="text" placeholder="或输入工程目录的绝对路径…" data-i18n-ph="project.pathPlaceholder">
      <button id="projectOpen" class="primary" data-i18n="project.open">打开</button>
    </div>
    <div class="modal-foot session-foot">
      <button id="sessionExport" data-i18n="session.export">导出会话</button>
      <button id="sessionImport" data-i18n="session.import">导入会话</button>
      <input type="file" id="sessionFile" accept=".cgx,application/json" hidden>
      <span class="hint" id="sessionHint"></span>
    </div>
  </div>

  <div id="timelineModal" class="modal">
    <div class="modal-head">
      <h2 data-i18n="timeline.title">操作时间轴</h2>
      <button class="modal-close" data-close="timelineModal">&times;</button>
    </div>
    <div class="tl-tools">
      <input id="tlSearch" type="search" placeholder="搜索函数名 / 备注…" data-i18n-ph="timeline.search">
      <div class="tl-chips" id="tlChips">
        <button data-ops="" class="on" data-i18n="timeline.all">全部</button>
        <button data-ops="node.annotate,edge.annotate" data-i18n="timeline.kindAnnotate">标注</button>
        <button data-ops="layout.save,layout.clear" data-i18n="timeline.kindLayout">布局</button>
        <button data-ops="delete,delete.restore,delete.clear" data-i18n="timeline.kindDelete">删除</button>
        <button data-ops="bookmark.save,bookmark.delete" data-i18n="timeline.kindBookmark">书签</button>
      </div>
      <span class="tl-count" id="tlCount"></span>
    </div>
    <div class="modal-body" id="timelineList"></div>
  </div>

  <div id="bookmarkModal" class="modal">
    <div class="modal-head">
      <h2 data-i18n="bookmark.title">视图书签</h2>
      <button class="modal-close" data-close="bookmarkModal">&times;</button>
    </div>
    <div class="modal-body" id="bookmarkList"></div>
    <div class="modal-foot">
      <input id="bookmarkName" type="text" placeholder="给当前视图起个名字，如「换挡链路」" data-i18n-ph="bookmark.placeholder">
      <button id="bookmarkSave" class="primary" data-i18n="bookmark.save">保存当前视图</button>
    </div>
  </div>

  <div id="aiModal" class="modal">
    <div class="modal-head">
      <h2 data-i18n="ai.title">AI 访问（MCP）</h2>
      <button class="modal-close" data-close="aiModal">&times;</button>
    </div>
    <div class="modal-body">
      <p class="ai-hint" data-i18n="ai.hint"></p>
      <div id="aiLevels"></div>
      <p id="aiLocked" class="ai-locked" hidden data-i18n="ai.locked"></p>
    </div>
    <div class="modal-foot">
      <button id="aiSave" class="primary" data-i18n="ai.save">保存</button>
    </div>
  </div>

  <aside id="right">
    <div class="sec" id="secLabel" style="display:none">
      <h3 data-i18n="panel.label">连线标签</h3>
      <div id="labelPanel"></div>
    </div>
    <div class="sec" id="secDetail">
      <h3 data-i18n="panel.detail">节点详情</h3>
      <div id="detail"><div class="empty" data-i18n="empty.detail">点击图中节点查看详情</div></div>
    </div>
    <div class="sec">
      <h3 data-i18n="panel.vars">全局变量 / 常量</h3>
      <div id="vars"><div class="empty" data-i18n="empty.vars">当前视图里没有全局变量</div></div>
    </div>
    <div class="sec" id="secEdges">
      <h3 data-i18n="panel.edges">调用关系</h3>
      <div id="edges"><div class="empty" data-i18n="empty.edges">—</div></div>
    </div>
  </aside>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
